<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Registro</title>
  </head>

  <body class="flex min-h-screen items-center justify-center bg-gray-100 p-6">
    <div class="w-full max-w-md">
      <div class="bg-white shadow-lg rounded-xl p-8">
        <div class="text-center mb-6">
          <div
            class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 mx-auto mb-3"
          >
            <i data-lucide="user-plus"></i>
          </div>

          <h2 class="text-2xl font-bold">Crear cuenta</h2>

          <p class="text-gray-500 text-sm">
            Registrate para comenzar a usar la aplicación
          </p>
        </div>

        <form id="form" class="space-y-4">
          <div>
            <label class="text-sm font-medium">Nombre completo</label>

            <div class="relative">
              <i
                data-lucide="user"
                class="absolute left-3 top-3 w-4 h-4 text-gray-400"
              ></i>

              <input
                id="name"
                type="text"
                placeholder="Tu nombre"
                class="w-full border rounded-lg pl-10 pr-3 py-2 focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <p id="nameError" class="text-red-500 text-sm"></p>
          </div>

          <div>
            <label class="text-sm font-medium">Correo electrónico</label>

            <div class="relative">
              <i
                data-lucide="mail"
                class="absolute left-3 top-3 w-4 h-4 text-gray-400"
              ></i>

              <input
                id="email"
                type="email"
                placeholder="correo@ejemplo.com"
                class="w-full border rounded-lg pl-10 pr-3 py-2 focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <p id="emailError" class="text-red-500 text-sm"></p>
          </div>

          <div>
            <label class="text-sm font-medium">Contraseña</label>

            <div class="relative">
              <i
                data-lucide="lock"
                class="absolute left-3 top-3 w-4 h-4 text-gray-400"
              ></i>

              <input
                id="password"
                type="password"
                placeholder="Crea una contraseña segura"
                class="w-full border rounded-lg pl-10 pr-10 py-2 focus:ring-2 focus:ring-blue-500"
              />

              <button
                type="button"
                id="togglePassword"
                class="absolute right-3 top-3 text-gray-400"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>

            <p id="passwordError" class="text-red-500 text-sm"></p>

            <div class="bg-gray-100 p-3 rounded-lg text-xs mt-2">
              <p class="font-medium mb-1">Requisitos de contraseña:</p>

              <div id="req1">❌ Al menos 8 caracteres</div>
              <div id="req2">❌ Una letra mayúscula</div>
              <div id="req3">❌ Una letra minúscula</div>
              <div id="req4">❌ Un número</div>
            </div>
          </div>

          <div>
            <label class="text-sm font-medium"> Confirmar contraseña </label>

            <div class="relative">
              <i
                data-lucide="lock"
                class="absolute left-3 top-3 w-4 h-4 text-gray-400"
              ></i>

              <input
                id="confirmPassword"
                type="password"
                placeholder="Repite tu contraseña"
                class="w-full border rounded-lg pl-10 pr-10 py-2 focus:ring-2 focus:ring-blue-500"
              />

              <button
                type="button"
                id="toggleConfirm"
                class="absolute right-3 top-3 text-gray-400"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>

            <p id="confirmError" class="text-red-500 text-sm"></p>
          </div>

          <button
            id="submitBtn"
            class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition"
          >
            Crear cuenta
          </button>

          <p class="text-center text-sm text-gray-500">
            ¿Ya tienes una cuenta?

            <a href="#" class="text-blue-600 hover:underline">
              Inicia sesión
            </a>
          </p>
        </form>
      </div>
    </div>

    <script src="registro.js"></script>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
