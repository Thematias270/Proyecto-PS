<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario de equipos</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
  </head>

  <body class="bg-gray-100">
    <main class="max-w-4xl mx-auto py-10 px-6">
      <header class="text-center mb-8">
        <h1 class="text-3xl font-bold flex items-center justify-center gap-2">
          <!-- <i data-lucide="monitor"></i> -->
          Inventario de equipos
        </h1>

        <p class="text-gray-600">
          Sistema de registro y control de equipos de cómputo
        </p>
      </header>

      <!-- SUBHEADER -->

      <div class="bg-white rounded-x1 shadow mb-6">
        <div class="border-b p-6">
          <div class="flex items-center gap-3">

            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-black text-white">
                <i data-lucide="monitor" class="w-5 h-5"></i>
            </div>

            <div>
              <h2 class="font-bold text-gray-700">Registro de equipo</h2>
              <p class="text-sm text-gray-500">
                Completa el formulario para agregar un nuevo equipo al inventario
              </p>
          </div>
        </div>
      </div>
      <form
        id="equipment-form"
        class="bg-white p-8 rounded-xl shadow space-y-8"
      >
        <!-- Identificación -->
        <section>
          <h2
            class="flex items-center gap-2 font-semibold text-gray-600 uppercase text-sm mb-4"
          >
            <i data-lucide="server"></i>
            Identificación del equipo
          </h2>

          <div class="grid md:grid-cols-3 gap-4">
            <div>
              <label class="text-sm">Nombre asignado</label>
              <input
                type="text"
                id="nombreAsignado"
                class="w-full border rounded p-2"
                placeholder="PC-001"
              />
            </div>

            <div>
              <label class="text-sm">Nombre actual</label>
              <input
                type="text"
                id="nombreActual"
                class="w-full border rounded p-2"
                placeholder="DESKTOP-ABC123"
              />
            </div>

            <div>
              <label class="text-sm">Nombre original</label>
              <input
                type="text"
                id="nombreOriginal"
                class="w-full border rounded p-2"
                placeholder="DESKTOP-XYZ789"
              />
            </div>
          </div>

          <label class="flex items-center gap-2 mt-4">
            <input type="checkbox" id="dominio" />
            ¿Conectado a dominio?
          </label>
        </section>

        <!-- Ubicación y Organizacion -->

        <section>
          <h2
            class="flex items-center gap-2 font-semibold text-gray-600 uppercase text-sm mb-4"
          >
            <i data-lucide="building-2"></i>
            Ubicación y Organización
          </h2>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="text-sm">Ubicación</label>
              <input
                type="text"
                id="ubicacion"
                class="w-full border rounded p-2"
                placeholder="Edificio Lujan"
              />
            </div>
            <div>
              <label class="text-sm">Instalación</label>
              <input
                type="text"
                id="instalacion"
                class="w-full border rounded p-2"
                placeholder="Oficina 301"
              />
            </div>

            <div class="relative w-full">
              <label class="text-sm">Área</label>
              <select id="area" class="w-full border border-gray-300 rounded-md pl-3 pr-9 py-2 bg-white text-sm
                hover:border-gray-400 hover:bg-gray-50
                focus:outline-none focus:ring-2 focus:ring-black focus:border-black
                transition appearance-none"
                onchange="mostrarCheck('checkArea')"
                >
                <option value="" disabled selected>Seleccionar área</option>
                <option>IT</option>
                <option>RRHH</option>
                <option>Ventas</option>
                <option>Operaciones</option>
                <option>Gerencia</option>
              </select>
              <i data-lucide="chevron-down"
               class="absolute right-3 top-9 w-4 h-4 text-gray-500 pointer-events-none"
               ></i>
               <i id="checkArea"
               data-lucide="check"
               class="hidden absolute right-9 top-9 w-4 h-4 text-green-600 pointer-events-none">
               </i>
            </div>

            <div>
              <label class="text-sm">Empresa</label>
              <input
                type="text"
                id="empresa"
                class="w-full border rounded p-2"
                placeholder="Nombre de la empresa"
              />
            </div>
          </div>
        </section>

        <!-- Hardware -->

        <section>
          <h2
            class="flex items-center gap-2 font-semibold text-gray-600 uppercase text-sm mb-4"
          >
            <i data-lucide="hard-drive"></i>
            Hardware
          </h2>

          <div class="grid md:grid-cols-2 gap-4">

            <div class="relative w-full">
              <label class="text-sm">Marca</label>

              <select id="marca" class="w-full border border-gray-300 rounded-md pl-3 pr-9 py-2 bg-white text-sm
                hover:border-gray-400 hover:bg-gray-50
                focus:outline-none focus:ring-2 focus:ring-black focus:border-black
                transition appearance-none"
                onchange="mostrarCheck('checkMarca')">
                <option value="" disabled selected>Seleccionar marca</option>
                <option>Dell</option>
                <option>HP</option>
                <option>Lenovo</option>
                <option>ASUS</option>
                <option>Acer</option>
              </select>
              <i data-lucide="chevron-down"
               class="absolute right-3 top-9 w-4 h-4 text-gray-500 pointer-events-none"
               ></i>
               <i id="checkMarca"
               data-lucide="check"
               class="hidden absolute right-9 top-9 w-4 h-4 text-green-600 pointer-events-none">
               </i>
               
            </div>

            <div>
              <label class="text-sm">Modelo</label>
              <input
                type="text"
                id="modelo"
                class="w-full border rounded p-2"
                placeholder="Latitude 5520"
              />
            </div>

            <div class="relative w-full">
              <label class="text-sm" placeholder="Seleccionar S/O"
                >Sistema operativo</label
              >
              <select id="sistemaOperativo" class="w-full border border-gray-300 rounded-md pl-3 pr-9 py-2 bg-white text-sm
                hover:border-gray-400 hover:bg-gray-50
                focus:outline-none focus:ring-2 focus:ring-black focus:border-black
                transition appearance-none"
                onchange="mostrarCheck('checkSO')">
                <option value="" disabled selected>Seleccionar S/O</option>
                <option>Windows 10</option>
                <option>Windows 11</option>
                <option>macOS</option>
                <option>Linux</option>
              </select>
                <i data-lucide="chevron-down"
                 class="absolute right-3 top-9 w-4 h-4 text-gray-500 pointer-events-none"
                 ></i>
                 <i id="checkSO"
                 data-lucide="check"
                 class="hidden absolute right-9 top-9 w-4 h-4 text-green-600 pointer-events-none">
                 </i>
            </div>

            <div>
              <label class="text-sm">Número de serie</label>
              <input
                type="text"
                id="numeroSerie"
                class="w-full border rounded p-2"
                placeholder="ABC123XYZ456"
              />
            </div>
          </div>
        </section>

        <!-- Componentes -->

        <section>
          <h2
            class="flex items-center gap-2 font-semibold text-gray-600 uppercase text-sm mb-4"
          >
            <i data-lucide="cpu"></i>
            Componentes
          </h2>

          <div class="grid md:grid-cols-3 gap-4">
            <div>
              <label class="flex items-center gap-1 text-sm">
                <i data-lucide="cpu" class="w-4 h-4"></i>
                CPU
              </label>
              <input
                type="text"
                id="cpu"
                class="w-full border rounded p-2"
                placeholder="Intel Core i7-1165G7"
              />
            </div>

            <div class="relative w-full">
              <label class="flex items-center gap-1 text-sm">
                <i data-lucide="memory-stick" class="w-4 h-4"></i>
                RAM
              </label>
              <select id="memoria" class="w-full border border-gray-300 rounded-md pl-3 pr-9 py-2 bg-white text-sm
                hover:border-gray-400 hover:bg-gray-50
                focus:outline-none focus:ring-2 focus:ring-black focus:border-black
                transition appearance-none"
                onchange="mostrarCheck('checkRam')">
                <option value="" disabled selected>Seleccionar RAM</option>
                <option>8 GB</option>
                <option>16 GB</option>
                <option>32 GB</option>
                <option>64 GB</option>
              </select>
                <i data-lucide="chevron-down"
                 class="absolute right-3 top-9 w-4 h-4 text-gray-500 pointer-events-none"
                 ></i>
                 <i id="checkRam"
                 data-lucide="check"
                 class="hidden absolute right-9 top-9 w-4 h-4 text-green-600 pointer-events-none">
                 </i>
            </div>

            <div class="relative w-full">
              <label class="flex items-center gap-1 text-sm">
                <i data-lucide="hard-drive" class="w-4 h-4"></i>
                Almacenamiento
              </label>
              <select id="almacenamiento" class="w-full border border-gray-300 rounded-md pl-3 pr-9 py-2 bg-white text-sm
                hover:border-gray-400 hover:bg-gray-50
                focus:outline-none focus:ring-2 focus:ring-black focus:border-black
                transition appearance-none"
                onchange="mostrarCheck('checkAlmacenamiento')">
                <option value="" disabled selected>Seleccionar almacenamiento</option>
                <option>128 GB</option>
                <option>256 GB</option>
                <option>512 GB</option>
                <option>1 TB</option>
                <option>2 TB</option>
              </select>
                <i data-lucide="chevron-down"
                 class="absolute right-3 top-9 w-4 h-4 text-gray-500 pointer-events-none"
                 ></i>
                 <i id="checkAlmacenamiento"
                 data-lucide="check"
                 class="hidden absolute right-9 top-9 w-4 h-4 text-green-600 pointer-events-none">
                 </i>
            </div>
          </div>
        </section>

        <!-- Responsable -->

        <section>
          <h2
            class="flex items-center gap-2 font-semibold text-gray-600 uppercase text-sm mb-4"
          >
            <i data-lucide="user"></i>
            Asignación
          </h2>

          <label class="text-sm">Responsable del equipo</label>
          <input
            type="text"
            id="responsable"
            class="w-full border rounded p-2"
            placeholder="Victor Muñoz"
          />
        </section>

        <div class="flex justify-end gap-3 pt-4 border-t">
          <button
            type="button"
            onclick="limpiarFormulario()"
            class="px-4 py-2 border rounded hover:bg-gray-100"
          >
            Limpiar
          </button>

          <button
            type="submit"
            id="btnRegistrar"
            class="px-4 py-2 bg-black text-white rounded hover:bg-gray-800"
          >
            Registrar Equipo
          </button>
        </div>
        <div id="notificacion"
        class="hidden mb-6 p-4 rounded-lg bg-green-100 border border-green-300 text-green-800 flex items-center gap-2">
        
        <i data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="mensajeNotificacion">Equipo registrado correctamente</span> 
        </div>
      </form>
    </main>

    <script>
      lucide.createIcons();
    </script>

    <script src="/JS/formulario.js"></script>
  </body>
</html>
